# =============================================================================
# Kafka Client Properties for SASL/SCRAM Testing
# =============================================================================
# This file contains client configuration for connecting to the secure Kafka
# broker using SASL_PLAINTEXT or SASL_SSL.
#
# Usage:
#   kafka-console-producer --bootstrap-server localhost:9093 \\
#     --producer.config client.properties --topic test-topic
# =============================================================================

# Security protocol - change to SASL_SSL for TLS testing
security.protocol=SASL_PLAINTEXT

# SASL configuration
sasl.mechanism=SCRAM-SHA-256
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="admin" password="admin-secret";

# For SASL_SSL connections, uncomment these lines:
# security.protocol=SASL_SSL
# ssl.truststore.location=/etc/kafka/secrets/kafka.client.truststore.jks
# ssl.truststore.password=testpass123
# ssl.endpoint.identification.algorithm=https
