// =============================================================================
// Kafka Server JAAS Configuration for SASL/SCRAM
// =============================================================================
// This file configures the JAAS login module for the Kafka broker's
// inter-broker communication using SCRAM-SHA-256.
// =============================================================================

KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_producer="producer-secret"
    user_consumer="consumer-secret"
    user_fraudapp="fraudapp-secret"
    user_schema-registry="schema-registry-secret";
};

// Client configuration for ZooKeeper (not used in KRaft mode but kept for compatibility)
KafkaClient {
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="admin"
    password="admin-secret";
};
