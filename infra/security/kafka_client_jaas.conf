// =============================================================================
// Kafka Client JAAS Configuration for SASL/SCRAM
// =============================================================================
// Template JAAS configuration for client applications connecting to
// SASL_PLAINTEXT or SASL_SSL listeners.
// 
// Usage: Set KAFKA_OPTS="-Djava.security.auth.login.config=/etc/kafka/kafka_client_jaas.conf"
// =============================================================================

KafkaClient {
    org.apache.kafka.common.security.scram.ScramLoginModule required
    username="admin"
    password="admin-secret";
};
