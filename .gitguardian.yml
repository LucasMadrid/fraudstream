version: '2.0'

# GitGuardian configuration
# These are test fixtures, not real secrets

secret:
  ignored_paths:
    - tests/fixtures/tls/*.pem
    - tests/fixtures/tls/**/*.pem
    - '**/test*/**/*.pem'
    
  ignored_matches:
    - name: Test TLS CA Key
      match: tests/fixtures/tls/ca-key.pem
    - name: Test TLS Server Key  
      match: tests/fixtures/tls/server-key.pem
    - name: Test TLS Client Key
      match: tests/fixtures/tls/client-key.pem